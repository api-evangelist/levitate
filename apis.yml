apis:
- name: Levitate MCP Server
  description: >-
    Hosted remote MCP server (streamable HTTP) that connects Levitate to AI assistants — Claude Desktop,
    Claude Code, ChatGPT, Cursor, VS Code Copilot, Windsurf and any MCP-compatible HTTP client. Tools
    cover contact search and profile lookup, contact tagging and edits, company search, action items,
    notes, contact timeline, donations and campaigns, opportunity pipelines, insurance policies, email
    drafts, email campaign and template management, social posts, file upload, and live queries across
    11+ connected integrations. Authentication is OAuth 2.0 with PKCE against login.levitate.ai; no API
    keys. The feature is enabled per account by a Levitate Success Specialist.
  humanURL: https://help.levitate.ai/article/589-levitate-mcp-server
  baseURL: https://mcp.levitate.ai/mcp
