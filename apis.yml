aid: levitate
name: Levitate
description: >-
  Levitate is a relationship-marketing and "Happiness Platform" SaaS for relationship-based small
  businesses — insurance agencies, financial advisors, law firms, nonprofits, home services and
  faith organizations — founded in 2017 in Raleigh, North Carolina by ShareFile founder Jesse Lipson.
  The product combines AI-assisted personal email at scale, text messaging, social posting, surveys
  and event registration, review generation, meeting booking, handwritten cards, donation and
  opportunity boards, and website publishing, all built around a contact record that stores "key
  facts" (birthdays, anniversaries, hobbies) used to drive timely, personalized outreach. Levitate
  exposes two developer surfaces: a REST Public API (OpenAPI 3.1.1) over Contacts, Key Facts,
  Companies and Notes at api.levitate.ai/public/v1, authenticated with Personal API Keys or OAuth 2.0
  authorization-code + PKCE bearer tokens; and a hosted, OAuth-protected remote MCP server at
  mcp.levitate.ai/mcp that gives AI assistants natural-language access to contacts, action items,
  donations, campaigns, opportunities, policies, notes and connected-integration data.
