  found: false
  note: >-
    Levitate's markets (SMB relationship marketing, insurance agency, financial advisory, nonprofit
    fundraising) do have candidate interchange standards — ACORD for P&C insurance, FDX for financial
    data, and CRM-side conventions — but the public-v1 contract declares NONE of them: no ACORD message
