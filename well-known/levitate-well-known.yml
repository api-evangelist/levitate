source: live HTTPS probes of every Levitate host named in apis.yml and the OpenAPI servers[] block
note: 'Levitate serves no security.txt, api-catalog or ai-plugin.json on any host. What it does serve
  is a complete OAuth 2.0 discovery surface: RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata on both api.levitate.ai and mcp.levitate.ai, plus full OpenID Connect discovery on login.levitate.ai.
  The RFC 9728 documents on the /mcp resource path are what let an MCP client discover Levitate''s authorization
  server automatically from the 401 challenge.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
