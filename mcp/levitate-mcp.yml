probe:
  url: https://mcp.levitate.ai/mcp
  method: POST tools/list (JSON-RPC 2.0)
  http_status: 401
  www_authenticate: Bearer resource_metadata="https://mcp.levitate.ai/.well-known/oauth-protected-resource/mcp"
  result: >-
    The live tools/list manifest is OAuth-gated, so tool input schemas could not be introspected
    anonymously. The tool inventory below is taken from Levitate's own published MCP documentation —
    names are verbatim only where the docs name them; the rest are recorded as capability
    descriptions, not invented tool identifiers.
  probed: '2026-08-25'
authorization:
  scheme: OAuth 2.0 authorization code + PKCE
  authorization_server: https://login.levitate.ai
  authorization_endpoint: https://login.levitate.ai/oauth2/authorize
  token_endpoint: https://login.levitate.ai/oauth2/token
  dynamic_client_registration: https://login.levitate.ai/oauth2/register
  protected_resource_metadata: https://mcp.levitate.ai/.well-known/oauth-protected-resource/mcp
  scopes_advertised:
    - openid
    - profile
    - email
  api_keys_supported: false
  note: >-
    Any Levitate user may connect; no admin setup is required, but the MCP feature must be enabled on
    the account by a Levitate Success Specialist first. A credential scoped to the MCP server cannot
    be used against the REST Public API and vice versa.
