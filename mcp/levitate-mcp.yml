tools_named_in_docs:
  - name: contacts_search
    category: contacts
    description: >-
      Search contacts by name, company, location, tags, last communication date and contact creation
      date; matches the full capability of the in-app AI assistant.
  - name: companies_search
    category: companies
    description: >-
      Search companies by name, tags or other attributes, with the same AND / OR / EXCLUDE tag logic
      available in the Levitate web app.
capabilities_documented:
  - area: contacts
    description: Full contact profile lookup including key dates, tags, custom properties and communication history; results carry a direct link to the contact profile in Levitate.
  - area: contacts
    description: Add tags to contacts individually or in bulk.
  - area: contacts
    description: Update contact name, job title, email address and phone number. Additive only — these tools cannot remove or clear existing contact data.
  - area: contacts
    description: Contact timeline — emails sent, notes recorded, calls logged and key dates.
  - area: notes
    description: Search and filter notes across the whole team or by rep, contact or date range.
  - area: action-items
    description: Search and filter action items by assignee, due date or completion status.
  - area: donations
    description: Search donations by amount, date, campaign or tags; look up campaigns by name.
  - area: opportunities
    description: Browse opportunity boards and stages; search deals by owner, close date, deal size or tags.
  - area: policies
    description: Review insurance policy information tied to contacts and accounts.
  - area: email
    description: Draft an email to a contact as a reviewable draft in Levitate — nothing sends until the user approves. O365/Outlook users must reconnect Microsoft to grant Mail.ReadWrite.
  - area: email-campaigns
    description: Create, update, schedule/send, get and list email campaigns; create, update and list email templates. Shipped July 2026.
  - area: social
    description: Create, update, schedule, get, list and delete social posts. Shipped July 2026.
  - area: files
    description: Upload files to Levitate via a two-step pre-signed URL flow. Shipped July 2026.
  - area: integrations
    description: Query live data from connected integrations across 11+ supported providers (CRM, calendar, HousecallPro and others). HousecallPro results are live rather than a daily snapshot.
divergence_from_rest:
  note: >-
    The MCP surface is materially WIDER than the REST Public API. REST covers Contacts, Key Facts,
    Companies and Notes only (19 operations). MCP additionally reaches action items, donations,
    campaigns, opportunities, insurance policies, email campaigns and templates, social posts, file
    upload and live connected-integration data — none of which have a public REST endpoint. See
    mcp/levitate-tool-crosswalk.yml.
provider_guidance:
  - "Do not connect the MCP server from a free tier of any AI assistant — Levitate accounts may hold sensitive client information."
