note: >-
  Levitate publishes NO rate limits for the Public API. The help-center API article covers
  authentication, scopes, use cases, best practices, troubleshooting and FAQs without mentioning a
  limit, quota, throttle or 429. The OpenAPI document declares no 429 response and no RateLimit-*,
  X-RateLimit-* or Retry-After header on any of the 19 operations. An agent therefore has no runtime
  signal to back off on, and no documented number to plan against. Recorded as an honest zero rather
  than an omission.
