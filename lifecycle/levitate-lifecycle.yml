  note: >-
    Levitate publishes no written API versioning policy. The version is expressed only as the /public/v1
    path segment and the public-v1 spec document name. The docs describe the reference as
    "always-current", and Levitate states that new functionality "may require additional scopes" —
    forward-additive language, but with no stated compatibility contract.
deprecation:
  policy_published: false
  sunset_header: not documented
  deprecation_header: not documented
  rfc8594: false
  deprecated_operations: 0
  note: >-
    No operation in public-v1 carries `deprecated: true`, and no deprecation, sunset or end-of-life
    policy is published for the API. The nearest published deprecation-like contract is credential
    expiry: a Personal API Key expires on a fixed 30/90/180/365-day term chosen at creation, cannot be
    renewed or extended, and every request with it then fails 401 with the expiry date in the body.
credential_lifecycle:
  personal_api_key:
    expiry_options_days: [30, 90, 180, 365]
    renewable: false
    extendable: false
    revocation: immediate on delete
    expired_signal: 'HTTP 401 with systemMessage "This API key expired on YYYY-MM-DD. Generate a new API key to continue."'
    guidance: A long-running integration needs a replacement key in place before the old one lapses.
  oauth_client:
    managed_by: account Admin / Super Admin, self-serve in the Levitate app
    redirect_uris: 1 to 5, https only
    flow: authorization code + PKCE only; client-secret flows unsupported
